name: Hermes
options:
  bundleIdPrefix: com.brianleach
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    CODE_SIGN_STYLE: Automatic

schemes:
  Hermes:
    shared: true
    build:
      targets:
        Hermes: all

targets:
  Hermes:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brianleach.hermes
        PRODUCT_NAME: Hermes
        INFOPLIST_FILE: Sources/Info.plist
